[project]
name = "kosarica"
version = "0.1.0"
description = "Tedenska košarica sezonske zelenjave"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = ["app", "store", "seed", "runtime_files", "build_bundle"]
